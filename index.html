        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<style>
#gcpSearch{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1500;width:270px;font:13px Arial,sans-serif}
#gcpSearch input{width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid rgba(0,0,0,.35);border-radius:4px;font-size:14px}
#gcpSearchList{background:#fff;color:#000;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.35);max-height:240px;overflow-y:auto;display:none;margin-top:2px}
#gcpSearchList div{padding:6px 10px;cursor:pointer}
#gcpSearchList div:hover,#gcpSearchList div.active{background:#dce9ff}
</style>
<div id="gcpSearch">
  <input id="gcpSearchBox" type="text" placeholder="Search GCP_No..." autocomplete="off">
  <div id="gcpSearchList"></div>
</div>
<script>
(function () {
  var FIELD = "GCP_No";
  var box = document.getElementById("gcpSearchBox");
  var list = document.getElementById("gcpSearchList");
  var items = [], shown = [], active = -1;

  if (window.L && L.DomEvent) {
    var wrap = document.getElementById("gcpSearch");
    L.DomEvent.disableClickPropagation(wrap);
    L.DomEvent.disableScrollPropagation(wrap);
  }

  function build() {
    if (items.length) return items;
    var m = window.map;
    if (!m) return items;
    m.eachLayer(function (l) {
      if (l.feature && l.feature.properties && l.feature.properties[FIELD] != null) {
        items.push({ name: String(l.feature.properties[FIELD]), layer: l });
      }
    });
    items.sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
    return items;
  }

  function render(q) {
    var all = build();
    list.innerHTML = "";
    active = -1;
    if (!q) { list.style.display = "none"; return; }
    var ql = q.toLowerCase();
    var starts = [], contains = [];
    for (var i = 0; i < all.length; i++) {
      var n = all[i].name.toLowerCase();
      if (n.indexOf(ql) === 0) starts.push(all[i]);
      else if (n.indexOf(ql) > -1) contains.push(all[i]);
    }
    shown = starts.concat(contains).slice(0, 15);
    if (!shown.length) {
      var none = document.createElement("div");
      none.textContent = all.length ? "No match" : "Map not ready";
      list.appendChild(none);
    }
    shown.forEach(function (it, idx) {
      var d = document.createElement("div");
      d.textContent = it.name;
      d.onclick = function () { go(it); };
      list.appendChild(d);
    });
    list.style.display = "block";
  }

  function go(it) {
    var m = window.map, l = it.layer;
    if (l.getLatLng) {
      m.setView(l.getLatLng(), Math.min(18, m.getMaxZoom() || 18));
    } else if (l.getBounds) {
      m.fitBounds(l.getBounds());
    }
    if (l.openPopup) setTimeout(function () { try { l.openPopup(); } catch (e) {} }, 350);
    box.value = it.name;
    list.style.display = "none";
  }

  function highlight() {
    var kids = list.children;
    for (var i = 0; i < kids.length; i++) kids[i].className = (i === active ? "active" : "");
  }

  box.addEventListener("input", function () { render(box.value.trim()); });
  box.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { active = Math.min(active + 1, shown.length - 1); highlight(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); highlight(); e.preventDefault(); }
    else if (e.key === "Enter") { var it = shown[active >= 0 ? active : 0]; if (it) go(it); }
    else if (e.key === "Escape") { list.style.display = "none"; }
  });
  document.addEventListener("click", function (e) {
    if (!document.getElementById("gcpSearch").contains(e.target)) list.style.display = "none";
  });
})();
</script>
<!-- GCP_SEARCH_END -->
